name: HRFlow CI

on:
  push:
    branches:
      - main
      - master
      - dev-lpa
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-unit-tests:
    name: Service unit tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            path: services/auth
          - name: paie
            path: services/paie
          - name: conges
            path: services/conges
          - name: recrutement
            path: services/recrutement
          - name: api-gateway
            path: services/api-gateway

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            services/*/package.json

      - name: Install service dependencies
        working-directory: ${{ matrix.path }}
        run: npm install

      - name: Run Jest unit tests with coverage
        working-directory: ${{ matrix.path }}
        run: npm test -- --coverage --runInBand

  frontend-tests-and-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    needs: service-unit-tests

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend unit tests
        working-directory: frontend
        run: CI=true npm test -- --watch=false --runInBand --coverage

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    needs:
      - service-unit-tests
      - frontend-tests-and-build

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            path: services/auth
          - name: paie
            path: services/paie
          - name: conges
            path: services/conges
          - name: recrutement
            path: services/recrutement
          - name: api-gateway
            path: services/api-gateway
          - name: frontend
            path: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies for audit
        working-directory: ${{ matrix.path }}
        run: npm install

      - name: Audit production dependencies
        working-directory: ${{ matrix.path }}
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  docker-build:
    name: Docker image build verification
    runs-on: ubuntu-latest
    needs:
      - service-unit-tests
      - frontend-tests-and-build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build auth image
        run: docker build -f docker/back/auth/Dockerfile .

      - name: Build paie image
        run: docker build -f docker/back/paie/Dockerfile .

      - name: Build conges image
        run: docker build -f docker/back/conges/Dockerfile .

      - name: Build recrutement image
        run: docker build -f docker/back/recrutement/Dockerfile .

      - name: Build api gateway image
        run: docker build -f docker/back/api-gateway/Dockerfile .

      - name: Build frontend image
        run: docker build -f docker/front/Dockerfile .
