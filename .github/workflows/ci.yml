name: HRFlow CI

on:
  push:
    branches:
      - main
      - master
      - dev-lpa

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  service-unit-tests:
    name: Service unit tests (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            path: services/auth
          - name: paie
            path: services/paie
          - name: conges
            path: services/conges
          - name: recrutement
            path: services/recrutement
          - name: api-gateway
            path: services/api-gateway

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install service dependencies
        working-directory: ${{ matrix.path }}
        run: npm install

      - name: Run Jest unit tests
        working-directory: ${{ matrix.path }}
        run: npm test -- --coverage --runInBand


  frontend-tests-and-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    needs: service-unit-tests

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test -- --watch=false --runInBand --coverage

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build


  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: frontend-tests-and-build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/