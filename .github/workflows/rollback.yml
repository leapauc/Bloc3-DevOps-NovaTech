name: HRFlow Rollback

# Rollback Blue-Green manuel : rebascule le listener ALB vers l'autre
# couleur (celle qui n'est pas active en ce moment). Pas de redeploy — cette
# couleur tourne déjà la dernière version connue-bonne (c'est le filet de
# sécurité de la bascule faite dans deploy.yml, job switch-traffic).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement à rollback"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: hrflow-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback to previous color
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_database_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_ssh_allowed_cidr: ${{ secrets.SSH_ALLOWED_CIDR }}
      TF_VAR_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          # cf. deploy.yml : le wrapper par défaut pollue stdout avec une
          # annotation d'erreur quand terraform échoue, ce qui casse la
          # capture `$(terraform output ...)` utilisée ici.
          terraform_wrapper: false

      - name: Terraform init & select workspace
        working-directory: ./terraform
        run: |
          terraform init -input=false
          terraform workspace select "${{ inputs.environment }}"

      - name: Determine rollback color
        working-directory: ./terraform
        run: |
          set -euo pipefail
          ACTIVE_COLOR="$(terraform output -raw active_color)"
          if [ "$ACTIVE_COLOR" = "blue" ]; then ROLLBACK_COLOR=green; else ROLLBACK_COLOR=blue; fi
          echo "Couleur active actuelle : $ACTIVE_COLOR -> rollback vers : $ROLLBACK_COLOR"
          echo "ROLLBACK_COLOR=${ROLLBACK_COLOR}" >> "$GITHUB_ENV"

      # La couleur idle ne reçoit aucun trafic entre deux déploiements : rien
      # ne garantit qu'elle soit toujours saine (pod crashé, nœud redémarré,
      # etc.). Basculer le listener dessus sans le savoir transforme un
      # rollback d'urgence en une seconde panne, découverte seulement via un
      # curl qui boucle sur des 502 pendant tout le timeout. On vérifie donc
      # la target group AVANT de toucher au listener, avec le vrai statut/la
      # vraie raison ELBv2 plutôt qu'un symptôme HTTP.
      - name: Check rollback target health before switching
        working-directory: ./terraform
        run: |
          set -euo pipefail
          TG_ARN="$(terraform output -json target_group_arns | jq -r --arg c "$ROLLBACK_COLOR" '.[$c]')"
          echo "TG_ARN=${TG_ARN}" >> "$GITHUB_ENV"

          HEALTH_JSON="$(aws elbv2 describe-target-health --target-group-arn "$TG_ARN")"
          echo "$HEALTH_JSON" | jq -r '.TargetHealthDescriptions[] | "\(.Target.Id): \(.TargetHealth.State) (\(.TargetHealth.Reason // "-"))"'

          UNHEALTHY="$(echo "$HEALTH_JSON" | jq '[.TargetHealthDescriptions[] | select(.TargetHealth.State != "healthy")] | length')"
          if [ "$UNHEALTHY" -gt 0 ]; then
            echo "::error::La couleur de rollback (${ROLLBACK_COLOR}) a des cibles non saines sur sa target group. Basculer dessus ne réglera pas l'incident actuel. Vérifier k3s/Traefik sur l'instance ${ROLLBACK_COLOR} (via SSM) avant de continuer."
            exit 1
          fi
          echo "Couleur de rollback (${ROLLBACK_COLOR}) : cibles saines, bascule du listener possible."

      - name: Switch ALB listener back
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var-file="${{ inputs.environment }}.tfvars" \
            -var="active_color=${ROLLBACK_COLOR}"

      - name: Verify rollback via public ALB
        working-directory: ./terraform
        run: |
          set -euo pipefail
          ALB_DNS_NAME="$(terraform output -raw alb_dns_name)"

          if timeout 60 bash -c "
            until curl -fsS http://${ALB_DNS_NAME}/ > /dev/null; do
              echo 'Waiting for ALB to serve the rolled-back color...'
              sleep 3
            done
          "; then
            echo "Rollback confirmé : l'ALB (${ALB_DNS_NAME}) sert de nouveau la couleur ${ROLLBACK_COLOR}."
          else
            echo "::error::L'ALB continue de renvoyer des erreurs après bascule vers ${ROLLBACK_COLOR}. État des cibles au moment de l'échec :"
            aws elbv2 describe-target-health --target-group-arn "$TG_ARN" \
              | jq -r '.TargetHealthDescriptions[] | "\(.Target.Id): \(.TargetHealth.State) (\(.TargetHealth.Reason // "-")) \(.TargetHealth.Description // "")"'
            exit 1
          fi
