name: HRFlow Rollback

# Rollback Blue-Green manuel : rebascule le listener ALB vers l'autre
# couleur (celle qui n'est pas active en ce moment). Pas de redeploy — cette
# couleur tourne déjà la dernière version connue-bonne (c'est le filet de
# sécurité de la bascule faite dans deploy.yml, job switch-traffic).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement à rollback"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: hrflow-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback to previous color
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_database_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_ssh_allowed_cidr: ${{ secrets.SSH_ALLOWED_CIDR }}
      TF_VAR_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          # cf. deploy.yml : le wrapper par défaut pollue stdout avec une
          # annotation d'erreur quand terraform échoue, ce qui casse la
          # capture `$(terraform output ...)` utilisée ici.
          terraform_wrapper: false

      - name: Terraform init & select workspace
        working-directory: ./terraform
        run: |
          terraform init -input=false
          terraform workspace select "${{ inputs.environment }}"

      - name: Determine rollback color
        working-directory: ./terraform
        run: |
          set -euo pipefail
          ACTIVE_COLOR="$(terraform output -raw active_color)"
          if [ "$ACTIVE_COLOR" = "blue" ]; then ROLLBACK_COLOR=green; else ROLLBACK_COLOR=blue; fi
          echo "Couleur active actuelle : $ACTIVE_COLOR -> rollback vers : $ROLLBACK_COLOR"
          echo "ROLLBACK_COLOR=${ROLLBACK_COLOR}" >> "$GITHUB_ENV"

      # La target group de la couleur idle n'est rattachée à AUCUN listener
      # tant qu'on n'a pas basculé : l'ALB ne lui envoie aucun health check et
      # la reporte "unused" (Target.NotInUse) qu'elle soit saine ou non. Donc
      # `describe-target-health` ne veut rien dire avant la bascule — c'est
      # l'état de l'instance EC2 elle-même qu'il faut vérifier : les deux
      # couleurs sont censées tourner en continu (design blue/green sans
      # scale-to-zero), donc une instance arrêtée (ex. coupée manuellement
      # pour limiter la facturation) casse le filet de sécurité du rollback.
      - name: Check rollback instance is running before switching
        working-directory: ./terraform
        run: |
          set -euo pipefail
          INSTANCE_ID="$(terraform output -raw "instance_id_${ROLLBACK_COLOR}")"
          STATE="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text)"
          echo "Instance ${ROLLBACK_COLOR} (${INSTANCE_ID}) : état = ${STATE}"

          if [ "$STATE" != "running" ]; then
            echo "::error::L'instance de la couleur de rollback (${ROLLBACK_COLOR}, ${INSTANCE_ID}) est à l'état '${STATE}', pas 'running'."
            echo "Le design blue/green suppose que les deux couleurs tournent en continu comme filet de sécurité."
            echo "Si elle a été coupée manuellement (ex. pour limiter la facturation), redémarrer avant de rollback :"
            echo "  aws ec2 start-instances --instance-ids ${INSTANCE_ID}"
            echo "Vérifier aussi que la RDS partagée tourne, puis attendre que k3s/Traefik soient de nouveau up avant de relancer ce workflow."
            exit 1
          fi

      - name: Switch ALB listener back
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var-file="${{ inputs.environment }}.tfvars" \
            -var="active_color=${ROLLBACK_COLOR}"

      - name: Verify rollback via public ALB
        working-directory: ./terraform
        run: |
          set -euo pipefail
          ALB_DNS_NAME="$(terraform output -raw alb_dns_name)"
          TG_ARN="$(terraform output -json target_group_arns | jq -r --arg c "$ROLLBACK_COLOR" '.[$c]')"

          if timeout 60 bash -c "
            until curl -fsS http://${ALB_DNS_NAME}/ > /dev/null; do
              echo 'Waiting for ALB to serve the rolled-back color...'
              sleep 3
            done
          "; then
            echo "Rollback confirmé : l'ALB (${ALB_DNS_NAME}) sert de nouveau la couleur ${ROLLBACK_COLOR}."
          else
            echo "::error::L'ALB continue de renvoyer des erreurs après bascule vers ${ROLLBACK_COLOR}. État des cibles au moment de l'échec :"
            aws elbv2 describe-target-health --target-group-arn "$TG_ARN" \
              | jq -r '.TargetHealthDescriptions[] | "\(.Target.Id): \(.TargetHealth.State) (\(.TargetHealth.Reason // "-")) \(.TargetHealth.Description // "")"'
            exit 1
          fi
