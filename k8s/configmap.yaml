apiVersion: v1
kind: ConfigMap
metadata:
  name: hrflow-config
  namespace: hrflow
data:
  NODE_ENV: production

  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: hrflow_dev
  DB_USER: hrflow

  AUTH_SERVICE_URL: http://auth:3001
  PAIE_SERVICE_URL: http://paie:3002
  CONGES_SERVICE_URL: http://conges:3003
  RECRUTEMENT_SERVICE_URL: http://recrutement:3004

  REDIS_HOST: redis
  REDIS_PORT: "6379"

  CORS_ALLOWED_ORIGINS: "*"