# k8s/conges/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conges
  namespace: hrflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: conges
  template:
    metadata:
      labels:
        app: conges
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: conges
          image: ${ECR_REGISTRY}/hrflow/conges:${IMAGE_TAG}
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: hrflow-config
            - secretRef:
                name: hrflow-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }