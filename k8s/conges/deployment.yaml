apiVersion: apps/v1
kind: Deployment
metadata:
  name: conges
  namespace: hrflow
spec:
  replicas: 2

  selector:
    matchLabels:
      app: conges

  template:
    metadata:
      labels:
        app: conges

    spec:
      containers:
        - name: conges
          image: ghcr.io/TON_USER/hrflow-conges:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3003

          envFrom:
            - configMapRef:
                name: hrflow-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrflow-secrets
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hrflow-secrets
                  key: DATABASE_URL

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi