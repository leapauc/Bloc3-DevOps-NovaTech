apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hrflow
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: ghcr.io/TON_USER/hrflow-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3005

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi