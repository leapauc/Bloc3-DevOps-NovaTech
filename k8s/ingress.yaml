apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hrflow-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # A adapter si votre api-gateway ne sert pas déjà ses routes sous /api
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3005
