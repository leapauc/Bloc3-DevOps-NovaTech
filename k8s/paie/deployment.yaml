apiVersion: apps/v1
kind: Deployment
metadata:
  name: paie
  namespace: hrflow
spec:
  replicas: 2

  selector:
    matchLabels:
      app: paie

  template:
    metadata:
      labels:
        app: paie

    spec:
      containers:
        - name: paie
          image: ghcr.io/TON_USER/hrflow-paie:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3002

          envFrom:
            - configMapRef:
                name: hrflow-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrflow-secrets
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hrflow-secrets
                  key: DATABASE_URL

            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hrflow-secrets
                  key: STRIPE_SECRET_KEY

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi