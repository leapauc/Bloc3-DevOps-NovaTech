# k8s/paie/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paie
  namespace: hrflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paie
  template:
    metadata:
      labels:
        app: paie
    spec:
      containers:
        - name: paie
          image: ${ECR_REGISTRY}/hrflow/paie:${IMAGE_TAG}
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: hrflow-config
            - secretRef:
                name: hrflow-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }