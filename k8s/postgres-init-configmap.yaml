# RDS est partagée entre les deux couleurs Blue-Green (voir terraform/main.tf,
# modules ec2_blue/ec2_green) : pendant une bascule, l'ancienne ET la nouvelle
# version du code lisent/écrivent le même schéma. Toute évolution ici doit
# donc rester compatible avec la version N-1 du code le temps de la fenêtre
# de coexistence :
#   - ajouts : colonnes nullable ou avec DEFAULT (jamais NOT NULL sans défaut)
#   - suppressions/renommages : jamais en direct, toujours en 2 releases
#     (release N : ajouter la nouvelle colonne + double-écriture par le code ;
#      release N+1, une fois la bascule confirmée stable : supprimer l'ancienne)
# Ce fichier doit rester idempotent (IF NOT EXISTS / ON CONFLICT) : il est
# ré-appliqué à chaque déploiement, sur la couleur idle comme sur l'active.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS users (
      id SERIAL PRIMARY KEY,
      email VARCHAR(255) UNIQUE NOT NULL,
      password_hash TEXT NOT NULL,
      role VARCHAR(50) NOT NULL DEFAULT 'employee',
      created_at TIMESTAMP DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS employees (
      id SERIAL PRIMARY KEY,
      user_id INTEGER REFERENCES users(id),
      nom VARCHAR(255),
      prenom VARCHAR(255),
      salaire_mensuel_brut DECIMAL(10,2) DEFAULT 3000,
      jours_conges_acquis INTEGER DEFAULT 25,
      created_at TIMESTAMP DEFAULT NOW(),
      updated_at TIMESTAMP DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS conges (
      id SERIAL PRIMARY KEY,
      employee_id INTEGER REFERENCES employees(id),
      date_debut DATE,
      date_fin DATE,
      nombre_jours INTEGER,
      motif TEXT,
      statut VARCHAR(50) DEFAULT 'en_attente',
      created_at TIMESTAMP DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS bulletins_paie (
      id SERIAL PRIMARY KEY,
      employee_id INTEGER REFERENCES employees(id),
      mois INTEGER,
      annee INTEGER,
      data JSONB,
      created_at TIMESTAMP DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS candidats (
      id SERIAL PRIMARY KEY,
      nom VARCHAR(255),
      prenom VARCHAR(255),
      email VARCHAR(255),
      poste VARCHAR(255),
      statut VARCHAR(50) DEFAULT 'nouveau',
      cv_path TEXT,
      created_at TIMESTAMP DEFAULT NOW()
    );
    INSERT INTO users (email, password_hash, role)
    VALUES ('test@novatech.fr', '$2b$10$zkzitvEvgv0FXj9e2o1WRugeWdCxiORi2AHQqZ1AfOFAPQvrHq8IS', 'employee')
    ON CONFLICT (email) DO NOTHING;
    INSERT INTO employees (user_id, nom, prenom, salaire_mensuel_brut, jours_conges_acquis)
    SELECT id, 'Dupont', 'Test', 3000, 25
    FROM users
    WHERE email = 'test@novatech.fr';
